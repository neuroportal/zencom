MEMORY {
    LOADADDR: start = $07FF, size = 2,     file = %O;
    # $4000-$43FF is VIC bank 1 too, but the VIC never reads it (bitmap
    # mode: matrix $4400, bitmap $6000), so CODE runs on to $43FF.
    MAIN:     start = $0801, size = $3BFF, file = %O, fill = yes;
    # $4400-$47FF: the ANSI colour matrix - filler in the file, cleared at
    # start-up.  $4800-$5FFF is free for more code (CODE2).
    GAP:      start = $4400, size = $0400, file = %O, fill = yes;
    MAIN2:    start = $4800, size = $1800, file = %O;   # below the bitmap at $6000
    # ZENCOM.XFR: file transfers, loaded at start-up into the RAM under the
    # BASIC ROM (switched out: BASIC never runs again).  Code below $B800;
    # $B800-$BFFF are its transfer blocks, $C000-$C46F its other buffers.
    # The menu overlay (see ovl_menu in zencom.s) comes first in the same
    # file, at $9000 (padded to 4 KB), but runs at $A000: it is exchanged
    # with the first 4 KB of the transfer code when the menu needs it.
    XFRADDR:  start = $8FFE, size = 2,     file = "dist/zencom.xfr";
    MENUF:    start = $9000, size = $1000, file = "dist/zencom.xfr", fill = yes;
    MENUR:    start = $A000, size = $1000, file = "";
    XFR:      start = $A000, size = $1800, file = "dist/zencom.xfr";
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = rw;
    CODE2:    load = MAIN2,    type = rw;
    XFRADDR:  load = XFRADDR,  type = ro;
    MENU:     load = MENUF,    run = MENUR, type = rw, define = yes;
    XFR:      load = XFR,      type = rw;
}
